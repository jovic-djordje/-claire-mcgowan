<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/Logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primarni SEO Meta Tagovi -->
    <title>Claire McGowan — Documentary Wedding Photographer</title>
    <meta
      name="description"
      content="Documentary wedding photographer based in Newcastle, capturing honest, unscripted love stories across the North East and worldwide destination weddings."
    />
    <meta name="author" content="Claire McGowan" />

    <!-- Open Graph / Facebook / Instagram / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Claire McGowan — Documentary Wedding Photographer"
    />
    <meta
      property="og:description"
      content="Documentary wedding photographer based in Newcastle, capturing honest, unscripted love stories across the North East and worldwide destination weddings."
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Claire McGowan — Documentary Wedding Photographer"
    />
    <meta
      name="twitter:description"
      content="Documentary wedding photographer based in Newcastle, capturing honest, unscripted love stories across the North East and worldwide destination weddings."
    />

    <!-- Optimizovano učitavanje isključivo Outfit fonta -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap"
    />
    <link
      rel="preload"
      as="image"
      href="/src/assets/hero-image.webp"
      fetchpriority="high"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
